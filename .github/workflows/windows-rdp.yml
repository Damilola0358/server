name: Windows-RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download & Extract Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip

    - name: Authenticate Ngrok
      run: |
        .\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

    - name: Set Password for Runner User
      run: |
        $admin = [adsi]("WinNT://./runneradmin,user")
        $admin.SetPassword("Vagrant@123456")

    - name: Start Ngrok Tunnel
      run: |
        Start-Process powershell -ArgumentList '-NoExit', '-Command', '.\ngrok\ngrok.exe tcp 3389 --region us'
        Start-Sleep -Seconds 12

    - name: Pre-Download Anti-Detect Browsers & Chrome to Desktop
      run: |
        $desktop = "C:\Users\runneradmin\Desktop"
        Write-Host "Auto-downloading Chrome, Undetectable, and BitBrowser to Desktop..."
        
        # Download Chrome
        Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "$desktop\ChromeSetup.exe"
        
        # Download Undetectable Installer
        try {
          Invoke-WebRequest -Uri "https://undetectable.io/download/windows" -OutFile "$desktop\UndetectableSetup.exe" -UserAgent "Mozilla/5.0"
        } catch {
          Write-Host "Redirect fallback for Undetectable"
        }

        # 1-Click Desktop Shortcuts for BitBrowser & Undetectable
        $WshShell = New-Object -ComObject WScript.Shell
        $Shortcut = $WshShell.CreateShortcut("$desktop\Open_BitBrowser_Download.url")
        $Shortcut.TargetPath = "https://www.bitbrowser.net/download/"
        $Shortcut.Save()

        $Shortcut2 = $WshShell.CreateShortcut("$desktop\Open_Undetectable_Download.url")
        $Shortcut2.TargetPath = "https://undetectable.io/download/"
        $Shortcut2.Save()

    - name: Get RDP Connection Info
      run: |
        $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
        $public_url = $response.tunnels[0].public_url
        Write-Host "=============================================" -ForegroundColor Green
        Write-Host "RDP CONNECT ADDRESS: $public_url" -ForegroundColor Yellow
        Write-Host "USERNAME: runneradmin" -ForegroundColor Yellow
        Write-Host "PASSWORD: Vagrant@123456" -ForegroundColor Yellow
        Write-Host "=============================================" -ForegroundColor Green

    - name: Keep Alive (6 Hours Loop)
      run: |
        $count = 0
        while ($count -lt 350) {
          Start-Sleep -Seconds 60
          $count++
          Write-Host "Active: $count minutes elapsed..."
        }
